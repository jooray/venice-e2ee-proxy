# Venice E2EE Proxy Configuration
#
# Environment variables override values in this file.
#
# Do NOT put your API key here. VENICE_API_KEY is read from the environment only
# (or from .env); a key found in this file is ignored with a warning. This file is
# the one that gets shared, pasted into issues and committed by accident.
#
#   cp .env.example .env    # then set VENICE_API_KEY in .env

# Server settings
port: 3000
host: "127.0.0.1"

# Venice API
venice_base_url: "https://api.venice.ai"

# Attestation verification
# When true (default), the proxy verifies the TEE attestation response:
#   - TDX quote integrity (teeType, debug mode)
#   - Client nonce binding (prevents replay attacks)
#   - Signing key binding (Ethereum address in REPORTDATA)
#   - Server verification cross-check
# Set to false to skip verification (NOT recommended for production)
verify_attestation: true

# Full DCAP verification
# When true, performs complete Intel TDX DCAP quote verification:
#   - PCK certificate chain validation up to Intel SGX Root CA
#   - Quote signature verification (ECDSA P-256)
#   - QE identity validation
#   - TCB level evaluation + CRL checking
# Requires @phala/dcap-qvl package: npm install @phala/dcap-qvl
enable_dcap: true

# Where DCAP collateral (PCK certificates, CRLs, TCB info) is fetched from.
# Unset defaults to Phala's public PCCS at https://pccs.phala.network, which
# also lets them observe which enclaves you verify and when, and makes your
# verification depend on their uptime. Intel signs the collateral either way,
# so serving it yourself changes who watches, not how strong the check is.
# dcap_pccs_url: "https://your-pccs.example/sgx/certification/v4"

# Check the GPU evidence Venice serves against NVIDIA rather than against
# Venice's own verdict on it (default true). Applies to both e2ee- and tee-
# models, which share the same attestation handshake.
#
# Session creation fails unless NVIDIA's Remote Attestation Service vouches for
# the evidence AND its eat_nonce matches the nonce this session sent — so the
# verdict is about your request, not a replayed report. Secure boot, debug
# status and measurement results are checked per GPU. It also fails when no GPU
# evidence is served, so the check cannot be skipped by omitting it.
#
# The cost is one NRAS round trip per session, which measures as noise next to
# the attestation handshake. The real trade is availability: sessions depend on
# NVIDIA being reachable, as enable_dcap already makes them depend on a PCCS.
#
# Read the GPU attestation section of the README before relying on this: a
# passing check does not prove the GPU is the machine that ran your prompt.
verify_gpu_attestation: true

# Point GPU verification at your own verifier instead of NVIDIA's public NRAS.
# nras_url: "https://your-verifier.example/v3/attest/gpu"

# Verify the ES384 signature on NVIDIA's tokens against its published key set,
# instead of trusting them because of the TLS connection they arrived on
# (default true, and only relevant when verify_gpu_attestation is on).
#
# Costs one cached key fetch per 15 minutes. NVIDIA rotates these signing
# certificates roughly every 48 hours, so the cache is deliberately short and
# refetches when a token names a key it does not hold.
verify_gpu_token_signatures: true

# Override where NVIDIA's signing keys are fetched from.
# nras_jwks_url: "https://nras.attestation.nvidia.com/.well-known/jwks.json"

# SHA-256 digests the token's signing leaf certificate must match exactly.
# For operators who obtained a signing leaf out of band and would rather not
# rely on the TLS fetch. Pinning an intermediate or root does nothing: the
# chain in the token is not path validated. Empty means no pinning.
gpu_pinned_certs: []

# Verify the signed receipt for each completion (default false).
# Attestation proves an enclave exists; the receipt proves the enclave signed a
# receipt for your completion id. Costs two extra round trips per request, run
# after the response is already sent, so results are logged rather than returned.
#
# Read the Response Receipts section of the README before relying on this. One
# limit remains, measured rather than assumed: the request/response body hashes
# cannot be reproduced from behind api.venice.ai, so those two checks never pass.
verify_receipts: false

# Gateway origin serving the native ACI attestation report, whose TDX quote
# covers sha256(JCS({purpose, workload_id, workload_keyset_digest, nonce})) — so
# a DCAP-verified quote commits to the keyset digest, and the receipt trust
# anchor is proven rather than pinned on first use.
#
# This is not api.venice.ai, and it takes no API key. Venice's own attestation
# endpoint serves the legacy report shape, which binds the E2EE key and nonce
# and says nothing about the keyset. Reaching the report over a different
# hostname costs nothing: the quote authenticates itself against Intel's roots,
# and the digest it commits to is checked against the one Venice reports.
#
# Requires enable_dcap. If the report cannot be fetched or verified, receipts
# are reported as unverifiable rather than quietly falling back to pinning.
# Set to "" to pin on first use instead.
aci_attestation_url: "https://tee.redpill.ai"

# Recheck the gateway's verdict on the machine it forwarded to, instead of
# reading it off the receipt.
#
# The receipt's upstream.verified event names an attested session whose id is
# content-addressed over the material the gateway verified — the channel
# binding, the claims, and a digest of the upstream's own attestation report.
# Fetching that session by id yields the report inline, so the second hop's TDX
# quote is DCAP-verified here rather than taken on the gateway's word, and the
# TLS key the gateway bound is checked against the upstream's attested keyset.
#
# One thing this cannot establish: the nonce behind that report is not
# published, so a captured report cannot be told from a current one. Freshness
# of the second hop still rests on the attested gateway having behaved.
#
# Costs one fetch and one extra DCAP run per attested channel, cached for the
# life of the session. Needs aci_attestation_url.
verify_upstream_sessions: true

# Where receipt anchors are recorded. With aci_attestation_url set these are a
# cache of the proven value; without it they are trust-on-first-use pins. Read
# once at startup, so removing a stale entry needs a restart.
receipt_anchor_store: ".venice-receipt-anchors.json"

# Anchors you established out of band. These win over anything pinned on first
# use, and a disagreement with the attestation is reported as a conflict rather
# than adopted. Leave empty to rely on first-use pinning.
# receipt_anchors:
#   e2ee-glm-5-2-p:
#     workloadId: "sha256:3def476b..."
#     workloadKeysetDigest: "sha256:c5c0f582..."

# Session TTL in milliseconds (default: 30 minutes)
# E2EE sessions are cached per model. After TTL expires, a new session
# is created with fresh key exchange and attestation verification.
session_ttl: 1800000

# Log level: debug, info, warn, error
log_level: "info"

# Models
# ------
# There is no model setting here — the model comes from each request, so any
# Venice model works without configuration. Prefix a model with `e2ee-` to get
# the encrypted path; anything else is forwarded to Venice untouched.
#
# Example request against the GLM model, which supports function calling:
#
#   curl http://127.0.0.1:3000/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{
#       "model": "e2ee-glm-5-2-p",
#       "messages": [{"role": "user", "content": "What is the weather in Bratislava?"}],
#       "tools": [{
#         "type": "function",
#         "function": {
#           "name": "get_weather",
#           "description": "Get the current weather in a given city",
#           "parameters": {
#             "type": "object",
#             "properties": {"city": {"type": "string"}},
#             "required": ["city"]
#           }
#         }
#       }]
#     }'
#
# Tool schemas and arguments are encrypted along with the conversation — see the
# Function Calling section of the README.
#
# Not every E2EE model supports tools. Verified working with function calling
# over E2EE, but Venice adds and drops models often, so check the live list
# rather than trusting these ids:
#   e2ee-glm-5-2-p        524K ctx  32K out  $1.75/$5.75 per M tokens
#   e2ee-deepseek-v4-flash 1M ctx   8K out  $0.182/$0.373
#   e2ee-qwen3-6-35b-a3b   32K ctx   4K out  $0.182/$1.18
# e2ee-qwen3-vl-30b-a3b-p advertises FC but the attestation endpoint 502s —
# re-probe before adding.
# Check the current list:
#   curl -H "Authorization: Bearer $VENICE_API_KEY" \
#     "https://api.venice.ai/api/v1/models?type=text"
