# Venice E2EE Proxy Configuration
#
# Environment variables override values in this file.
#
# Do NOT put your API key here. VENICE_API_KEY is read from the environment only
# (or from .env); a key found in this file is ignored with a warning. This file is
# the one that gets shared, pasted into issues and committed by accident.
#
#   cp .env.example .env    # then set VENICE_API_KEY in .env

# Server settings
port: 3000
host: "127.0.0.1"

# Venice API
venice_base_url: "https://api.venice.ai"

# Attestation verification
# When true (default), the proxy verifies the TEE attestation response:
#   - TDX quote integrity (teeType, debug mode)
#   - Client nonce binding (prevents replay attacks)
#   - Signing key binding (Ethereum address in REPORTDATA)
#   - Server verification cross-check
# Set to false to skip verification (NOT recommended for production)
verify_attestation: true

# Full DCAP verification
# When true, performs complete Intel TDX DCAP quote verification:
#   - PCK certificate chain validation up to Intel SGX Root CA
#   - Quote signature verification (ECDSA P-256)
#   - QE identity validation
#   - TCB level evaluation + CRL checking
# Requires @phala/dcap-qvl package: npm install @phala/dcap-qvl
enable_dcap: true

# Session TTL in milliseconds (default: 30 minutes)
# E2EE sessions are cached per model. After TTL expires, a new session
# is created with fresh key exchange and attestation verification.
session_ttl: 1800000

# Log level: debug, info, warn, error
log_level: "info"

# Models
# ------
# There is no model setting here — the model comes from each request, so any
# Venice model works without configuration. Prefix a model with `e2ee-` to get
# the encrypted path; anything else is forwarded to Venice untouched.
#
# Example request against the GLM model, which supports function calling:
#
#   curl http://127.0.0.1:3000/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{
#       "model": "e2ee-glm-5-2-p",
#       "messages": [{"role": "user", "content": "What is the weather in Bratislava?"}],
#       "tools": [{
#         "type": "function",
#         "function": {
#           "name": "get_weather",
#           "description": "Get the current weather in a given city",
#           "parameters": {
#             "type": "object",
#             "properties": {"city": {"type": "string"}},
#             "required": ["city"]
#           }
#         }
#       }]
#     }'
#
# Tool schemas and arguments are encrypted along with the conversation — see the
# Function Calling section of the README.
#
# Not every E2EE model supports tools. Verified working with function calling
# over E2EE (July 2026):
#   e2ee-glm-5-2-p        524K ctx  32K out  $1.75/$5.75 per M tokens
#   e2ee-deepseek-v4-flash 1M ctx   8K out  $0.182/$0.373
#   e2ee-qwen3-6-27b      256K ctx  32K out  $0.346/$3.46
#   e2ee-qwen3-6-35b-a3b   32K ctx   4K out  $0.182/$1.18
#   e2ee-gemma-4-31b       32K ctx   4K out  $0.139/$0.43
# Check the current list:
#   curl -H "Authorization: Bearer $VENICE_API_KEY" \
#     "https://api.venice.ai/api/v1/models?type=text"
